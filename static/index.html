<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reseller Scanner</title>
<link rel="manifest" href="/static/manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:700;margin-bottom:2px}
.sub{font-size:12px;color:#555;margin-bottom:20px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.cost-label{font-size:14px;color:#888;white-space:nowrap}
.cost-input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 12px;color:#fff;font-size:16px;width:100px;outline:none}
.cost-input:focus{border-color:#444}
.scan-btn{flex:1;background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.scan-btn:hover{background:#1d4ed8}
.scan-btn:disabled{background:#1e2a3a;color:#4a6080;cursor:not-allowed}
#fileInput{display:none}
.preview{width:100%;max-height:180px;object-fit:contain;border-radius:10px;margin-bottom:14px;display:none;background:#111}
.loading{display:none;text-align:center;padding:32px 0}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #222;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:#666}
.results{display:none}
.verdict{border-radius:14px;padding:20px 16px;text-align:center;margin-bottom:14px}
.verdict.buy{background:#052e16;border:1px solid #16a34a}
.verdict.pass{background:#2d0707;border:1px solid #dc2626}
.verdict.maybe{background:#2d1a00;border:1px solid #d97706}
.verdict-label{font-size:32px;font-weight:800;letter-spacing:1px}
.verdict.buy .verdict-label{color:#22c55e}
.verdict.pass .verdict-label{color:#ef4444}
.verdict.maybe .verdict-label{color:#f59e0b}
.verdict-sub{font-size:14px;color:#888;margin-top:6px}
.key-numbers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kn-card{background:#1a1a1a;border-radius:12px;padding:14px;text-align:center}
.kn-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kn-value{font-size:26px;font-weight:700;color:#fff}
.kn-value.green{color:#22c55e}
.kn-value.red{color:#ef4444}
.kn-value.yellow{color:#f59e0b}
.card{background:#1a1a1a;border-radius:12px;padding:14px;margin-bottom:10px}
.card-label{font-size:11px;color:#444;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.item-name{font-size:16px;font-weight:600;color:#fff;line-height:1.3}
.item-brand{font-size:13px;color:#666;margin-top:3px}
.item-source{font-size:11px;color:#333;margin-top:3px}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #222}
.price-row:last-child{border:none}
.price-row .pl{font-size:13px;color:#777}
.price-row .pv{font-size:14px;font-weight:600;color:#fff}
.price-row .pv.g{color:#22c55e}
.price-row .pv.r{color:#ef4444}
.market-text{font-size:13px;color:#888;line-height:1.6}
.market-link{display:inline-block;margin:6px 6px 0 0;font-size:11px;color:#2563eb;text-decoration:none;background:#0d1a2e;padding:3px 8px;border-radius:6px}
.reset-btn{width:100%;background:transparent;color:#444;border:1px solid #222;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;margin-top:8px}
.reset-btn:hover{color:#888;border-color:#333}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reseller Scanner</h1>
  <p class="sub">Snap an item — get a buy/pass decision instantly</p>
  <div class="top">
    <span class="cost-label">Paid $</span>
    <input class="cost-input" type="number" id="costInput" placeholder="0.00" step="0.01" min="0">
    <button class="scan-btn" id="scanBtn" onclick="triggerCamera()">Scan Item</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <img id="preview" class="preview" alt="">
  <div class="loading" id="loading"><div class="spinner"></div><div class="loading-text" id="loadingText">Identifying item...</div></div>
  <div class="results" id="results">
    <div class="verdict" id="verdictBox"><div class="verdict-label" id="verdictLabel">--</div><div class="verdict-sub" id="verdictSub"></div></div>
    <div class="key-numbers">
      <div class="kn-card"><div class="kn-label">Sells For</div><div class="kn-value" id="sellsFor">--</div></div>
      <div class="kn-card"><div class="kn-label">You Make</div><div class="kn-value" id="youMake">--</div></div>
    </div>
    <div class="card" id="itemCard"><div class="card-label">Item</div><div class="item-name" id="itemName">--</div><div class="item-brand" id="itemBrand"></div><div class="item-source" id="itemSource"></div></div>
    <div class="card" id="breakdownCard" style="display:none"><div class="card-label">Margin Breakdown</div><div id="breakdownRows"></div></div>
    <div class="card" id="marketCard" style="display:none"><div class="card-label">Market Research</div><div class="market-text" id="marketText"></div><div id="marketLinks"></div></div>
    <button class="reset-btn" onclick="resetApp()">Scan Another Item</button>
  </div>
</div>
<script>
var imgB64="",upc="";
function triggerCamera(){document.getElementById("fileInput").click();}
document.getElementById("fileInput").addEventListener("change",function(e){var file=e.target.files[0];if(!file)return;var objectUrl=URL.createObjectURL(file);compressImage(objectUrl,function(c){URL.revokeObjectURL(objectUrl);imgB64=c;var p=document.getElementById("preview");p.src=c;p.style.display="block";tryBarcode(c);doScan();});});
function compressImage(dataUrl,cb){var img=new Image();img.onerror=function(){cb('');};img.onload=function(){var max=1024,w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.8));};img.src=dataUrl;}
function tryBarcode(d){if(typeof Quagga==="undefined")return;Quagga.decodeSingle({decoder:{readers:["ean_reader","upc_reader","upc_e_reader","code_128_reader"]},locate:true,src:d},function(r){if(r&&r.codeResult)upc=r.codeResult.code;});}
function setLoading(t){document.getElementById("loading").style.display="block";document.getElementById("results").style.display="none";document.getElementById("loadingText").textContent=t||"Identifying item...";document.getElementById("scanBtn").disabled=true;}
function doScan(){
  if (!imgB64 || imgB64.length < 100) {
    document.getElementById('loadingText').textContent = 'No image captured — try selecting the photo again';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('scanBtn').disabled = false;
    return;
  }setLoading("Identifying item...");var cost=parseFloat(document.getElementById("costInput").value)||0;var steps=["Identifying item...","Looking up prices...","Calculating margins..."];var si=0;var iv=setInterval(function(){si++;if(si<steps.length)document.getElementById("loadingText").textContent=steps[si];},2500);fetch("/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:imgB64,upc:upc,cost_paid:cost})}).then(function(r) {
    if (!r.ok) {
      return r.json().then(function(e) { throw new Error(e.error || 'Server error ' + r.status); });
    }
    return r.json();
  }).then(function(data){clearInterval(iv);document.getElementById("loading").style.display="none";showResults(data,cost);}).catch(function(err){clearInterval(iv);document.getElementById("loading").style.display="none";document.getElementById("loadingText").textContent="Error: "+err.message;document.getElementById("loading").style.display="block";document.getElementById("scanBtn").disabled=false;});}
function showResults(data,cost){document.getElementById("results").style.display="block";document.getElementById("scanBtn").disabled=false;var ident=data.identification||{};if(ident.name){document.getElementById("itemName").textContent=ident.name;document.getElementById("itemBrand").textContent=ident.brand||"";document.getElementById("itemSource").textContent="via barcode lookup";}else if(ident.description){var lines=ident.description.split("\n");document.getElementById("itemName").textContent=lines[0].replace(/^[\d\.\)\-\*]+\s*/,"").substring(0,120);document.getElementById("itemBrand").textContent=lines[1]?lines[1].replace(/^[\d\.\)\-\*]+\s*/,"").substring(0,80):"";document.getElementById("itemSource").textContent="via AI vision";}var keepa=data.keepa||{},margin=data.margin||{};var sellPrice=margin.sell_price||keepa.buy_box||keepa.avg_new_90d||null;var netProfit=margin.net_profit;document.getElementById("sellsFor").textContent=sellPrice?"$"+sellPrice.toFixed(2):"N/A";if(netProfit!==undefined&&netProfit!==null){var ym=document.getElementById("youMake");ym.textContent="$"+netProfit.toFixed(2);ym.className="kn-value "+(netProfit>10?"green":netProfit>0?"yellow":"red");}var vBox=document.getElementById("verdictBox"),vLabel=document.getElementById("verdictLabel"),vSub=document.getElementById("verdictSub");vBox.className="verdict";if(netProfit!==undefined&&netProfit!==null){if(netProfit>10){vBox.classList.add("buy");vLabel.textContent="BUY IT";vSub.textContent="$"+netProfit.toFixed(2)+" profit"+(margin.roi_pct?" · "+margin.roi_pct+"% ROI":"");}else if(netProfit>0){vBox.classList.add("maybe");vLabel.textContent="THIN MARGIN";vSub.textContent="Only $"+netProfit.toFixed(2)+" profit — your call";}else{vBox.classList.add("pass");vLabel.textContent="PASS";vSub.textContent="Loses $"+Math.abs(netProfit).toFixed(2)+" after fees";}}else if(sellPrice){vBox.classList.add("maybe");vLabel.textContent="CHECK IT";vSub.textContent="Sells for $"+sellPrice.toFixed(2)+" · enter your cost for verdict";}else{vBox.classList.add("pass");vLabel.textContent="NO DATA";vSub.textContent="Could not find pricing data";}if(margin.sell_price){document.getElementById("breakdownCard").style.display="block";document.getElementById("breakdownRows").innerHTML=row("Sell price","$"+margin.sell_price.toFixed(2),"")+row("Platform fees (~15%)","-$"+margin.estimated_fees.toFixed(2),"r")+row("Shipping estimate","-$"+margin.estimated_shipping.toFixed(2),"r")+row("Your cost","-$"+parseFloat(margin.cost_paid).toFixed(2),"r")+row("Net profit","$"+margin.net_profit.toFixed(2),margin.net_profit>0?"g":"r");}var linkup=data.linkup||{};if(linkup.answer){document.getElementById("marketCard").style.display="block";document.getElementById("marketText").textContent=linkup.answer.substring(0,400)+(linkup.answer.length>400?"...":"");if(linkup.sources&&linkup.sources.length){document.getElementById("marketLinks").innerHTML=linkup.sources.slice(0,4).map(function(s){return'<a class="market-link" href="'+s.url+'" target="_blank">'+(s.name||"Source")+"</a>";}).join("");}}}
function row(label,val,cls){return'<div class="price-row"><span class="pl">'+label+'</span><span class="pv '+cls+'">'+val+'</span></div>';}
function resetApp(){imgB64="";upc="";document.getElementById("preview").style.display="none";document.getElementById("preview").src="";document.getElementById("fileInput").value="";document.getElementById("results").style.display="none";document.getElementById("scanBtn").disabled=false;document.getElementById("costInput").value="";}
if("serviceWorker"in navigator){navigator.serviceWorker.register("/static/sw.js").catch(function(){});}
</script>
</body>
</html>
