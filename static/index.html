<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reseller Scanner</title>
  <link rel="manifest" href="/static/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border:  #2e2e2e;
      --buy:     #00e676;
      --pass:    #ff1744;
      --thin:    #ffab00;
      --text:    #ffffff;
      --muted:   #777;
      --radius:  16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 32px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---- Top bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 2px;
    }
    .topbar-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .health-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
    }
    .health-dot.ok   { background: var(--buy); }
    .health-dot.warn { background: var(--thin); }
    .health-dot.err  { background: var(--pass); }

    /* ---- Cost input ---- */
    .cost-row {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 18px;
      height: 58px;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .cost-row:focus-within { border-color: #444; }
    .cost-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cost-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      outline: none;
      min-width: 0;
      -webkit-appearance: none;
    }
    .cost-row input::placeholder { color: #333; }

    /* ---- Platform row ---- */
    .platform-row {
      display: flex;
      gap: 6px;
    }
    .platform-btn {
      flex: 1;
      padding: 9px 2px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .platform-btn.active {
      border-color: var(--buy);
      color: var(--buy);
      background: rgba(0,230,118,0.07);
    }

    /* ---- Preview strip ---- */
    .preview-strip {
      position: relative;
      width: 100%;
      height: 120px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      display: none;
    }
    .preview-strip.visible { display: block; }
    .preview-strip img { width: 100%; height: 100%; object-fit: cover; }
    .barcode-tag {
      position: absolute;
      top: 8px; left: 8px;
      background: var(--buy);
      color: #000;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      display: none;
    }
    .barcode-tag.visible { display: block; }

    /* ---- Scan button ---- */
    #fileInput { display: none; }

    .btn-scan {
      width: 100%;
      height: 66px;
      background: var(--buy);
      color: #000;
      font-size: 1.15rem;
      font-weight: 900;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.8px;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-scan:active { transform: scale(0.97); }
    .btn-scan:disabled { opacity: 0.3; cursor: default; }

    /* ---- Loader ---- */
    .loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px 0 20px;
    }
    .loader.visible { display: flex; }
    .spinner {
      width: 46px; height: 46px;
      border: 3px solid var(--border);
      border-top-color: var(--buy);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-msg { font-size: 0.9rem; color: var(--muted); }

    /* ======== RESULTS ======== */
    .results { display: flex; flex-direction: column; gap: 10px; }

    /* ---- VERDICT BANNER ---- */
    .verdict-banner {
      border-radius: var(--radius);
      padding: 20px 20px 18px;
    }
    .verdict-banner.buy  { background: rgba(0,230,118,0.1);  border: 1.5px solid rgba(0,230,118,0.35); }
    .verdict-banner.pass { background: rgba(255,23,68,0.1);  border: 1.5px solid rgba(255,23,68,0.35); }
    .verdict-banner.thin { background: rgba(255,171,0,0.1);  border: 1.5px solid rgba(255,171,0,0.35); }
    .verdict-banner.info { background: var(--surface);       border: 1px solid var(--border); }

    .verdict-word {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1.5px;
    }
    .verdict-word.buy  { color: var(--buy); }
    .verdict-word.pass { color: var(--pass); }
    .verdict-word.thin { color: var(--thin); }
    .verdict-word.info { color: var(--muted); font-size: 1.8rem; }

    .verdict-sub {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .verdict-item {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .verdict-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .verdict-brand {
      margin-top: 3px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ---- Big numbers ---- */
    .numbers-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .num-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .num-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .num-value {
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .num-value.green  { color: var(--buy); }
    .num-value.red    { color: var(--pass); }
    .num-value.yellow { color: var(--thin); }

    /* ---- Divider ---- */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 0;
    }
    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-divider span {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--border);
    }

    /* ---- Detail cards ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .card-body { padding: 12px 16px; }

    /* Breakdown rows */
    .brow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
    }
    .brow + .brow { border-top: 1px solid var(--border); }
    .brow-label { font-size: 0.83rem; color: var(--muted); }
    .brow-value { font-size: 0.92rem; font-weight: 700; }
    .brow.total .brow-label { color: var(--text); font-size: 0.9rem; font-weight: 600; }
    .brow.total .brow-value { font-size: 1.05rem; }

    /* Amazon grid */
    .ag { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ac {
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .ac-label { font-size: 0.65rem; color: var(--muted); margin-bottom: 4px; }
    .ac-value  { font-size: 1.05rem; font-weight: 700; }
    .ac-value.green { color: var(--buy); }

    /* Web snippet */
    .web-text {
      font-size: 0.84rem;
      line-height: 1.6;
      color: #bbb;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .web-sources {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .web-sources a {
      font-size: 0.68rem;
      color: #444;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .error-msg {
      background: rgba(255,23,68,0.08);
      border: 1px solid rgba(255,23,68,0.25);
      border-radius: var(--radius);
      padding: 18px;
      font-size: 0.88rem;
      color: var(--pass);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="topbar-title">Reseller Scanner</span>
    <div class="health-dot" id="healthDot"></div>
  </div>

  <!-- Cost â always visible -->
  <div class="cost-row">
    <span class="cost-label">Paid $</span>
    <input type="number" id="costInput" placeholder="0.00" min="0" step="0.25" inputmode="decimal">
  </div>

  <!-- Platform -->
  <div class="platform-row" id="platformRow">
    <button class="platform-btn active" data-platform="ebay">eBay</button>
    <button class="platform-btn" data-platform="amazon">Amazon</button>
    <button class="platform-btn" data-platform="mercari">Mercari</button>
    <button class="platform-btn" data-platform="poshmark">Poshmark</button>
  </div>

  <!-- Preview (shown after photo) -->
  <div class="preview-strip" id="previewStrip">
    <img id="preview" alt="">
    <span class="barcode-tag" id="barcodeBadge"></span>
  </div>

  <!-- Scan -->
  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <button class="btn-scan" id="btnScan">ð·&nbsp;&nbsp;SCAN ITEM</button>

  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span class="loader-msg" id="loaderMsg">Scanningâ¦</span>
  </div>

  <!-- Results -->
  <div class="results" id="results"></div>

</div>
<script>
  let selectedFile = null;
  let selectedPlatform = 'ebay';
  let loaderInterval = null;
  const loaderMessages = ['Identifying itemâ¦', 'Looking up pricesâ¦', 'Calculating marginâ¦', 'Almost doneâ¦'];

  const fileInput    = document.getElementById('fileInput');
  const preview      = document.getElementById('preview');
  const previewStrip = document.getElementById('previewStrip');
  const barcodeBadge = document.getElementById('barcodeBadge');
  const btnScan      = document.getElementById('btnScan');
  const costInput    = document.getElementById('costInput');
  const loader       = document.getElementById('loader');
  const loaderMsg    = document.getElementById('loaderMsg');
  const results      = document.getElementById('results');
  const healthDot    = document.getElementById('healthDot');

  // Health
  (async () => {
    try {
      const d = await (await fetch('/health')).json();
      const ok = d.anthropic === 'configured';
      const partial = d.keepa !== 'configured' || d.linkup !== 'configured';
      healthDot.className = 'health-dot ' + (ok ? (partial ? 'warn' : 'ok') : 'err');
      healthDot.title = `Anthropic:${d.anthropic} Keepa:${d.keepa} Linkup:${d.linkup}`;
    } catch { healthDot.className = 'health-dot err'; }
  })();

  // Platform
  document.getElementById('platformRow').addEventListener('click', e => {
    const b = e.target.closest('.platform-btn');
    if (!b) return;
    document.querySelectorAll('.platform-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    selectedPlatform = b.dataset.platform;
  });

  // Compress
  function compressImage(file, maxDim, quality) {
    return new Promise(resolve => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width: w, height: h } = img;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(blob => resolve(new File([blob], 'scan.jpg', { type: 'image/jpeg' })), 'image/jpeg', quality);
      };
      img.onerror = () => resolve(file);
      img.src = url;
    });
  }

  btnScan.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    barcodeBadge.classList.remove('visible');
    preview.src = URL.createObjectURL(file);
    previewStrip.classList.add('visible');
    results.innerHTML = '';
    selectedFile = await compressImage(file, 1024, 0.82);
    doScan();
  });

  async function doScan() {
    if (!selectedFile) return;
    setLoading(true);
    results.innerHTML = '';
    const fd = new FormData();
    fd.append('image', selectedFile);
    const cost = parseFloat(costInput.value);
    if (!isNaN(cost) && cost > 0) fd.append('cost', cost);
    fd.append('platform', selectedPlatform);
    try {
      const resp = await fetch('/scan', { method: 'POST', body: fd });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Server error');
      render(data);
    } catch (err) {
      results.innerHTML = `<div class="error-msg">â ï¸ ${esc(err.message)}<br><small style="color:var(--muted);margin-top:6px;display:block">Try again or check your connection</small></div>`;
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    loader.classList.toggle('visible', on);
    btnScan.disabled = on;
    if (on) {
      let i = 0; loaderMsg.textContent = loaderMessages[0];
      loaderInterval = setInterval(() => { loaderMsg.textContent = loaderMessages[++i % loaderMessages.length]; }, 1600);
    } else {
      clearInterval(loaderInterval);
    }
  }

  function render(data) {
    const frag = document.createDocumentFragment();
    const id     = data.identification || {};
    const margin = data.margin;
    const amazon = (data.pricing || {}).amazon;
    const web    = (data.pricing || {}).web;

    if (data.barcode) {
      barcodeBadge.textContent = 'ð ' + data.barcode;
      barcodeBadge.classList.add('visible');
    }

    // Determine verdict
    let vc = 'info', vt = 'SCAN', vs = 'enter a cost to see verdict';
    let sellPrice = null, netProfit = null, roi = null;

    if (margin) {
      netProfit = margin.net_profit;
      sellPrice = margin.sell_price;
      roi = margin.roi_percent;
      if (netProfit > 5 && roi > 30)      { vc = 'buy';  vt = 'BUY';          vs = `${roi}% ROI Â· sell on ${margin.platform}`; }
      else if (netProfit > 0)             { vc = 'thin'; vt = 'THIN MARGIN';   vs = `only +$${netProfit.toFixed(2)} Â· ${roi}% ROI`; }
      else                                { vc = 'pass'; vt = 'PASS';          vs = `loses $${Math.abs(netProfit).toFixed(2)} after fees`; }
    } else if (amazon && amazon.best_price_estimate) {
      sellPrice = amazon.best_price_estimate;
      vc = 'info'; vt = 'PRICED'; vs = `enter cost to see profit`;
    }

    // ââ VERDICT BANNER ââ
    const banner = el('div', `verdict-banner ${vc}`);
    banner.innerHTML = `
      <div class="verdict-word ${vc}">${vt}</div>
      <div class="verdict-sub">${esc(vs)}</div>
      ${(id.title || id.brand) ? `<div class="verdict-item">
        ${id.title ? `<div class="verdict-name">${esc(id.title)}</div>` : ''}
        ${id.brand && id.brand !== 'Unknown' ? `<div class="verdict-brand">${esc(id.brand)}</div>` : ''}
      </div>` : ''}
    `;
    frag.appendChild(banner);

    // ââ BIG NUMBERS ââ
    if (sellPrice !== null || netProfit !== null) {
      const row = el('div', 'numbers-row');

      const c1 = el('div', 'num-cell');
      c1.innerHTML = `<div class="num-label">Sell For</div><div class="num-value">${sellPrice != null ? '$' + sellPrice.toFixed(2) : 'â'}</div>`;

      const c2 = el('div', 'num-cell');
      const pcolor = netProfit == null ? '' : netProfit > 5 ? 'green' : netProfit > 0 ? 'yellow' : 'red';
      const ptext  = netProfit != null ? (netProfit >= 0 ? '+' : '') + '$' + Math.abs(netProfit).toFixed(2) : 'â';
      c2.innerHTML = `<div class="num-label">You Make</div><div class="num-value ${pcolor}">${ptext}</div>`;

      row.append(c1, c2);
      frag.appendChild(row);
    }

    // ââ DIVIDER ââ
    const div = el('div', 'section-divider');
    div.innerHTML = '<span>details</span>';
    frag.appendChild(div);

    // ââ BREAKDOWN ââ
    if (margin) {
      const card = makeCard('Profit Breakdown');
      const body = el('div', 'card-body');
      [
        ['Sell price',               `$${margin.sell_price.toFixed(2)}`,        ''],
        [`${cap(margin.platform)} fees`, `â$${margin.fees.toFixed(2)}`,         ''],
        ['Shipping est.',            `â$${margin.estimated_shipping.toFixed(2)}`,''],
        ['You paid',                 `â$${margin.cost.toFixed(2)}`,             ''],
      ].forEach(([l, v]) => body.innerHTML += brow(l, v));
      const pc = margin.net_profit > 0 ? 'var(--buy)' : 'var(--pass)';
      body.innerHTML += `<div class="brow total">
        <span class="brow-label">Net profit</span>
        <span class="brow-value" style="color:${pc}">${margin.net_profit >= 0 ? '+' : ''}$${margin.net_profit.toFixed(2)} <span style="font-size:0.78rem;font-weight:500;color:var(--muted)">(${margin.roi_percent}% ROI)</span></span>
      </div>`;
      card.appendChild(body);
      frag.appendChild(card);
    }

    // ââ AMAZON ââ
    if (amazon && !amazon.error) {
      const card = makeCard('Amazon Â· Keepa');
      const body = el('div', 'card-body');
      body.innerHTML = `<div class="ag">
        ${ac('Current',     amazon.amazon_price_current || amazon.marketplace_new_current)}
        ${ac('90-Day Avg',  amazon.amazon_price_avg90 || amazon.marketplace_new_avg90, true)}
        ${acRank('Sales Rank', amazon.sales_rank_current)}
        ${ac('Best Estimate', amazon.best_price_estimate, true)}
      </div>`;
      card.appendChild(body);
      frag.appendChild(card);
    }

    // ââ WEB ââ
    if (web && !web.error && web.answer) {
      const card = makeCard('Market Research Â· Linkup');
      const body = el('div', 'card-body');
      // Trim to ~180 chars, sentence boundary
      let snippet = web.answer.length > 200
        ? web.answer.slice(0, 200).replace(/[^.!?]*$/, '').trim() || web.answer.slice(0, 180) + 'â¦'
        : web.answer;
      body.innerHTML = `<div class="web-text">${esc(snippet)}</div>`;
      if (web.sources && web.sources.length) {
        const sd = el('div', 'web-sources');
        web.sources.slice(0, 3).forEach(u => {
          if (u) sd.innerHTML += `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0])}</a>`;
        });
        body.appendChild(sd);
      }
      card.appendChild(body);
      frag.appendChild(card);
    }

    results.appendChild(frag);
  }

  // Helpers
  function el(tag, cls) { const e = document.createElement(tag); e.className = cls; return e; }
  function makeCard(title) {
    const card = el('div', 'card');
    card.innerHTML = `<div class="card-header">${esc(title)}</div>`;
    return card;
  }
  function brow(label, value) {
    return `<div class="brow"><span class="brow-label">${esc(label)}</span><span class="brow-value">${esc(value)}</span></div>`;
  }
  function ac(label, val, hi) {
    const d = val != null ? '$' + parseFloat(val).toFixed(2) : 'â';
    return `<div class="ac"><div class="ac-label">${esc(label)}</div><div class="ac-value ${hi && val ? 'green' : ''}">${d}</div></div>`;
  }
  function acRank(label, val) {
    return `<div class="ac"><div class="ac-label">${esc(label)}</div><div class="ac-value">${val != null ? '#' + val.toLocaleString() : 'â'}</div></div>`;
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(() => {});
</script>
</body>
</html>
